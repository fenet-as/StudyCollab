version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studycollab-db
    environment:
      POSTGRES_DB: studycollab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432" # Allows GUI tools like DBeaver or pgAdmin on your laptop to connect
    volumes:
      - postgres_data:/var/lib/postgresql/data # Ensures database data persists across restarts

  spring-app:
    build: .
    container_name: studycollab-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studycollab
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345678
    depends_on:
      - postgres

volumes:
  postgres_data: