name: Study Collab CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test Backend
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint, Test, and Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  publish-docker-images:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Push Settings
        id: docker_meta
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "image_prefix=$DOCKER_USER" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "image_prefix=studycollab" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.docker_meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ steps.docker_meta.outputs.push == 'true' }}
          tags: ${{ steps.docker_meta.outputs.image_prefix }}/studycollab-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ steps.docker_meta.outputs.push == 'true' }}
          tags: ${{ steps.docker_meta.outputs.image_prefix }}/studycollab-frontend:latest
